# Build an UNSIGNED device IPA so it can be signed elsewhere (ESign / Sideloadly / TrollStore).
#
# The stock workflow (ios-build.yml) compiles for the simulator with signing off, which
# yields a .app that cannot be installed on a phone. This one compiles for arm64 device,
# still unsigned, then packs Payload/ into an .ipa and uploads it as an artifact.
#
# Put this file at .github/workflows/ios-build-ipa.yml in your fork.
# Actions -> "Build unsigned IPA" -> Run workflow -> download the artifact -> sign it yourself.

name: Build unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    # Try the newest macOS image first; the matrix lets an unavailable label fall through
    # instead of parking the job in "queued" forever. fail-fast stays off for that reason.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: Xcode
        run: |
          # Take the newest Xcode the image actually has; the project needs 27.x for its
          # SwiftUI type-checking, and an older one fails the build outright.
          ls /Applications | grep -i xcode || true
          xcodebuild -version

      - name: Cache nodejs-mobile
        id: nodejs-mobile
        uses: actions/cache@v5
        with:
          path: |
            vendor/nodejs-mobile/ios
            vendor/nodejs-mobile/rooted
          key: nodejs-mobile-${{ hashFiles('scripts/fetch-nodejs-mobile.sh') }}

      - name: Fetch nodejs-mobile
        if: steps.nodejs-mobile.outputs.cache-hit != 'true'
        run: scripts/fetch-nodejs-mobile.sh

      - name: Cache Python
        id: python
        uses: actions/cache@v5
        with:
          path: |
            vendor/python/ios
            vendor/python/rooted
          key: python-${{ hashFiles('scripts/fetch-python.sh') }}

      - name: Fetch Python
        if: steps.python.outputs.cache-hit != 'true'
        run: scripts/fetch-python.sh

      - name: Check NodeMobile imports
        run: scripts/check-root-imports.sh

      - name: Cache libgit2
        id: libgit2
        uses: actions/cache@v5
        with:
          path: |
            vendor/libgit2/Libgit2.xcframework
            vendor/libgit2/ios-arm64
            vendor/libgit2/macos
          key: libgit2-${{ runner.os }}-${{ hashFiles('scripts/build-libgit2.sh') }}

      - name: Build libgit2
        if: steps.libgit2.outputs.cache-hit != 'true'
        run: scripts/build-libgit2.sh

      - name: Cache FFmpeg
        id: ffmpeg
        uses: actions/cache@v5
        with:
          path: vendor/ffmpeg/FFmpeg.xcframework
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/fetch-ffmpeg.sh', 'scripts/build-ffmpeg.sh', 'native/ffmpeg/**') }}

      - name: Fetch FFmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: scripts/fetch-ffmpeg.sh

      - name: Assemble engine
        run: scripts/build-engine.sh

      - name: Generate project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          cd app && xcodegen generate --quiet

      # arm64 device, Release, signing fully off.
      - name: Compile (iOS device, unsigned)
        working-directory: app
        run: |
          xcodebuild -project DshIOS.xcodeproj -scheme DshIOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData -skipPackagePluginValidation \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" EXPANDED_CODE_SIGN_IDENTITY=""`n            OTHER_SWIFT_FLAGS="'$(inherited) -Xfrontend -solver-expression-time-threshold=30000 -Xfrontend -warn-long-expression-type-checking=8000"' \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find app/build/DerivedData/Build/Products -maxdepth 2 -name '*.app' -type d | head -n 1)"
          if [ -z "$APP" ]; then echo "no .app produced"; find app/build/DerivedData/Build/Products -maxdepth 3 -type d | head -40; exit 1; fi
          echo "app: $APP"
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          ( cd out && zip -qry FishPocket-unsigned.ipa Payload )
          ls -lh out/FishPocket-unsigned.ipa
          echo "bundle id: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" || true)"
          echo "bundle ver: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" || true)"

      - uses: actions/upload-artifact@v4
        with:
          name: FishPocket-unsigned-ipa
          path: out/FishPocket-unsigned.ipa
          retention-days: 7
