# Build an UNSIGNED device IPA (arm64) so it can be signed elsewhere.
#
# macos-15 is the only hosted label that exists for this account; the image ships
# Xcode 16.x as the DEFAULT toolchain and also has Xcode 26.x installed side by
# side. `xcodebuild -version` therefore reports 16.4 unless DEVELOPER_DIR is
# pointed at a 26.x bundle — which is what made an earlier run die on
# "no such module 'AlarmKit'". The "Select Xcode 26" step below picks the newest
# installed 26.x and asserts the iOS SDK is >= 26.

name: Build unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          echo "installed Xcode bundles:"
          ls -d /Applications/Xcode*.app || true
          PICK=""
          for V in 26.4 26.3 26.3.0 26.2 26.2.0 26.1 26.1.1 26.0 26.0.1; do
            for C in "/Applications/Xcode_${V}.app" "/Applications/Xcode_${V%.0}.0.app"; do
              if [ -x "$C/Contents/Developer/usr/bin/xcodebuild" ]; then PICK="$C"; break 2; fi
            done
          done
          if [ -z "$PICK" ]; then
            for C in /Applications/Xcode*.app; do
              if /usr/libexec/PlistBuddy -c 'Print :DTXcode' "$C/Contents/Info.plist" 2>/dev/null | grep -q '^26'; then PICK="$C"; fi
            done
          fi
          if [ -z "$PICK" ]; then echo "no Xcode 26.x installed"; ls -d /Applications/Xcode*.app; exit 1; fi
          echo "DEVELOPER_DIR=$PICK/Contents/Developer" >> "$GITHUB_ENV"
          echo "picked: $PICK"
          "$PICK/Contents/Developer/usr/bin/xcodebuild" -version
          SDK="$("$PICK/Contents/Developer/usr/bin/xcodebuild" -showsdks 2>/dev/null | sed -n 's/.*-sdk iphoneos\([0-9][0-9.]*\).*/\1/p' | sort -n | tail -1)"
          echo "iphoneos SDK: ${SDK:-unknown}"
          case "$SDK" in 26.*|27.*) ;; *) echo "iOS SDK $SDK has no AlarmKit"; exit 1 ;; esac

      - name: Toolchain check
        run: |
          set -euo pipefail
          xcodebuild -version
          echo "DEVELOPER_DIR=$DEVELOPER_DIR"

      - name: Cache nodejs-mobile
        id: nodejs-mobile
        uses: actions/cache@v5
        with:
          path: |
            vendor/nodejs-mobile/ios
            vendor/nodejs-mobile/rooted
          key: nodejs-mobile-${{ hashFiles('scripts/fetch-nodejs-mobile.sh') }}

      - name: Fetch nodejs-mobile
        if: steps.nodejs-mobile.outputs.cache-hit != 'true'
        run: scripts/fetch-nodejs-mobile.sh

      - name: Cache Python
        id: python
        uses: actions/cache@v5
        with:
          path: |
            vendor/python/ios
            vendor/python/rooted
          key: python-${{ hashFiles('scripts/fetch-python.sh') }}

      - name: Fetch Python
        if: steps.python.outputs.cache-hit != 'true'
        run: scripts/fetch-python.sh

      - name: Check NodeMobile imports
        run: scripts/check-root-imports.sh

      - name: Cache libgit2
        id: libgit2
        uses: actions/cache@v5
        with:
          path: |
            vendor/libgit2/Libgit2.xcframework
            vendor/libgit2/ios-arm64
            vendor/libgit2/macos
          key: libgit2-${{ runner.os }}-${{ hashFiles('scripts/build-libgit2.sh') }}

      - name: Build libgit2
        if: steps.libgit2.outputs.cache-hit != 'true'
        run: scripts/build-libgit2.sh

      - name: Cache FFmpeg
        id: ffmpeg
        uses: actions/cache@v5
        with:
          path: vendor/ffmpeg/FFmpeg.xcframework
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/fetch-ffmpeg.sh', 'scripts/build-ffmpeg.sh', 'native/ffmpeg/**') }}

      - name: Fetch FFmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: scripts/fetch-ffmpeg.sh

      - name: Assemble engine
        run: scripts/build-engine.sh

      - name: Generate project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          cd app && xcodegen generate --quiet

      - name: Compile (iOS device, unsigned)
        working-directory: app
        run: |
          xcodebuild -project DshIOS.xcodeproj -scheme DshIOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData -skipPackagePluginValidation \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" EXPANDED_CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            OTHER_SWIFT_FLAGS='$(inherited) -Xfrontend -solver-expression-time-threshold=600000 -Xfrontend -warn-long-expression-type-checking=10000' \
            build > /tmp/xcodebuild.log 2>&1 || {
              RC=$?
              echo "=== build failed, rc=$RC ==="
              grep -nE "error:|BUILD FAILED|The following build commands failed" /tmp/xcodebuild.log | head -120
              echo "=== last 80 lines ==="
              tail -80 /tmp/xcodebuild.log
              exit $RC
            }
          grep -E "BUILD SUCCEEDED" /tmp/xcodebuild.log | tail -3

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find app/build/DerivedData/Build/Products -maxdepth 2 -name '*.app' -type d | head -n 1)"
          if [ -z "$APP" ]; then echo "no .app produced"; find app/build/DerivedData/Build/Products -maxdepth 3 -type d | head -40; exit 1; fi
          echo "app: $APP"
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          ( cd out && zip -qry FishPocket-unsigned.ipa Payload )
          ls -lh out/FishPocket-unsigned.ipa
          echo "bundle id: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" || true)"
          echo "bundle ver: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" || true)"
          echo "jailbreak plugin in bundle:"
          ls -l "$APP/engine/plugins/jailbreak/index.mjs" || echo "MISSING jailbreak plugin"

      - uses: actions/upload-artifact@v4
        with:
          name: FishPocket-unsigned-ipa
          path: out/FishPocket-unsigned.ipa
          retention-days: 7
